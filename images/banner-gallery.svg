<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img">
  <title>Camera surrounded by photo frames from campus life</title>
  <rect width="960" height="300" rx="20" fill="#2f2a77"/>
  <circle cx="120" cy="60" r="70" fill="#5b54c9" opacity="0.45"/>
  <circle cx="860" cy="250" r="90" fill="#16a394" opacity="0.30"/>

  <!-- photo frames -->
  <g transform="rotate(-8 200 150)">
    <rect x="120" y="80" width="160" height="130" rx="10" fill="#ffffff"/>
    <rect x="132" y="92" width="136" height="88" rx="6" fill="#16a394"/>
    <circle cx="170" cy="120" r="14" fill="#f2a33c"/>
    <path d="M132 180 l46 -40 l34 28 l22 -18 l34 30 z" fill="#2f2a77" opacity="0.7"/>
  </g>
  <g transform="rotate(7 760 150)">
    <rect x="680" y="76" width="160" height="130" rx="10" fill="#ffffff"/>
    <rect x="692" y="88" width="136" height="88" rx="6" fill="#f2a33c"/>
    <circle cx="760" cy="122" r="22" fill="#ffe0b8"/>
    <path d="M722 176 c0 -26 18 -34 38 -34 s38 8 38 34 z" fill="#5b54c9"/>
  </g>

  <!-- camera -->
  <rect x="380" y="100" width="200" height="130" rx="18" fill="#ffffff"/>
  <rect x="420" y="82" width="60" height="26" rx="8" fill="#ffffff"/>
  <circle cx="480" cy="165" r="44" fill="#2f2a77"/>
  <circle cx="480" cy="165" r="28" fill="#5b54c9"/>
  <circle cx="470" cy="155" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="548" cy="122" r="8" fill="#f2a33c"/>
</svg>
