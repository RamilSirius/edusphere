<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img">
  <title>Open laptop with a padlock and a key on the screen</title>
  <rect width="480" height="300" rx="20" fill="#efeefc"/>
  <circle cx="410" cy="60" r="46" fill="#f2a33c" opacity="0.25"/>
  <circle cx="70" cy="240" r="56" fill="#5b54c9" opacity="0.18"/>

  <!-- laptop -->
  <rect x="110" y="66" width="260" height="150" rx="12" fill="#2f2a77"/>
  <rect x="122" y="78" width="236" height="126" rx="7" fill="#ffffff"/>
  <rect x="84" y="216" width="312" height="14" rx="7" fill="#413c9e"/>

  <!-- padlock -->
  <path d="M212 132 v-16 a28 28 0 0 1 56 0 v16" fill="none" stroke="#5b54c9" stroke-width="9"/>
  <rect x="198" y="130" width="84" height="62" rx="10" fill="#f2a33c"/>
  <circle cx="240" cy="156" r="9" fill="#2f2a77"/>
  <rect x="236" y="160" width="8" height="18" rx="3" fill="#2f2a77"/>

  <!-- key -->
  <circle cx="330" cy="248" r="16" fill="none" stroke="#16a394" stroke-width="7"/>
  <path d="M346 248 h56 v12 M386 248 v10" fill="none" stroke="#16a394" stroke-width="7" stroke-linecap="round"/>

  <!-- password dots -->
  <circle cx="150" cy="104" r="5" fill="#d9d7f1"/>
  <circle cx="166" cy="104" r="5" fill="#d9d7f1"/>
  <circle cx="182" cy="104" r="5" fill="#d9d7f1"/>
  <circle cx="198" cy="104" r="5" fill="#d9d7f1"/>
</svg>
