<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img">
  <title>Three mentors next to a chat bubble with a code review comment</title>
  <rect width="960" height="300" rx="20" fill="#2f2a77"/>
  <circle cx="860" cy="70" r="80" fill="#5b54c9" opacity="0.45"/>
  <circle cx="110" cy="250" r="90" fill="#16a394" opacity="0.30"/>

  <!-- mentor 1 -->
  <circle cx="190" cy="130" r="38" fill="#f6d2ae"/>
  <path d="M152 124 a38 38 0 0 1 76 0 c0 -28 -18 -42 -38 -42 s-38 14 -38 42 z" fill="#4a3424"/>
  <path d="M120 250 c0 -46 30 -72 70 -72 s70 26 70 72 z" fill="#16a394"/>
  <!-- mentor 2 -->
  <circle cx="330" cy="120" r="42" fill="#ffe0b8"/>
  <path d="M288 112 a42 42 0 0 1 84 0 c-8 -30 -26 -44 -42 -44 s-34 14 -42 44 z" fill="#241a12"/>
  <path d="M252 250 c0 -52 34 -80 78 -80 s78 28 78 80 z" fill="#f2a33c"/>
  <!-- mentor 3 -->
  <circle cx="470" cy="134" r="36" fill="#f6d2ae"/>
  <path d="M434 130 a36 36 0 0 1 72 0 c0 -24 -16 -38 -36 -38 s-36 14 -36 38 z" fill="#2d2d2d"/>
  <rect x="446" y="126" width="20" height="12" rx="5" fill="none" stroke="#2f2a77" stroke-width="3"/>
  <rect x="474" y="126" width="20" height="12" rx="5" fill="none" stroke="#2f2a77" stroke-width="3"/>
  <path d="M404 250 c0 -44 28 -68 66 -68 s66 24 66 68 z" fill="#8f88f2"/>

  <!-- chat bubble with code review -->
  <rect x="600" y="84" width="270" height="130" rx="18" fill="#ffffff"/>
  <path d="M640 214 l-14 30 l40 -30 z" fill="#ffffff"/>
  <rect x="628" y="110" width="110" height="12" rx="6" fill="#5b54c9"/>
  <rect x="628" y="134" width="200" height="10" rx="5" fill="#d9d7f1"/>
  <rect x="628" y="154" width="170" height="10" rx="5" fill="#d9d7f1"/>
  <rect x="628" y="176" width="70" height="20" rx="10" fill="#16a394"/>
  <path d="M842 112 l8 8 l14 -16" fill="none" stroke="#16a394" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
