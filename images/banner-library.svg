<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img">
  <title>Bookshelf, an open book and a magnifying glass over a search bar</title>
  <rect width="960" height="300" rx="20" fill="#2f2a77"/>
  <circle cx="110" cy="70" r="80" fill="#5b54c9" opacity="0.45"/>
  <circle cx="880" cy="240" r="95" fill="#16a394" opacity="0.30"/>

  <!-- bookshelf -->
  <rect x="90" y="210" width="260" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="110" y="120" width="30" height="90" rx="5" fill="#f2a33c"/>
  <rect x="146" y="100" width="26" height="110" rx="5" fill="#ffffff"/>
  <rect x="178" y="130" width="34" height="80" rx="5" fill="#16a394"/>
  <rect x="218" y="110" width="24" height="100" rx="5" fill="#8f88f2"/>
  <rect x="250" y="138" width="80" height="22" rx="5" fill="#f2a33c" transform="rotate(-18 290 149)"/>

  <!-- search bar -->
  <rect x="400" y="118" width="300" height="56" rx="28" fill="#ffffff"/>
  <rect x="432" y="140" width="150" height="12" rx="6" fill="#d9d7f1"/>
  <circle cx="660" cy="146" r="14" fill="none" stroke="#2f2a77" stroke-width="5"/>
  <line x1="670" y1="156" x2="682" y2="168" stroke="#2f2a77" stroke-width="5" stroke-linecap="round"/>

  <!-- open book -->
  <path d="M760 120 q50 -18 90 0 v92 q-40 -18 -90 0 z" fill="#ffffff"/>
  <path d="M850 120 q40 -18 80 0 v92 q-40 -18 -80 0 z" fill="#efeefc"/>
  <line x1="776" y1="140" x2="834" y2="134" stroke="#5b54c9" stroke-width="5" stroke-linecap="round"/>
  <line x1="776" y1="160" x2="834" y2="154" stroke="#d9d7f1" stroke-width="5" stroke-linecap="round"/>
  <line x1="866" y1="134" x2="914" y2="140" stroke="#f2a33c" stroke-width="5" stroke-linecap="round"/>
  <line x1="866" y1="154" x2="914" y2="160" stroke="#d9d7f1" stroke-width="5" stroke-linecap="round"/>

  <rect x="400" y="200" width="220" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
</svg>
